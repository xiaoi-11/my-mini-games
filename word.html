<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Speed Reader</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-red: #e74c3c;
            --input-bg: #222;
            --input-border: #444;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        /* --- SETUP SCREEN CSS --- */
        #setup-screen {
            font-family: sans-serif;
            background: var(--surface);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid #333;
        }

        h2 { margin-top: 0; color: var(--text-main); }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        textarea, input, select {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box; 
        }
        
        textarea:focus, input:focus { outline: 2px solid var(--text-muted); }

        textarea { height: 120px; resize: none; }

        /* TABS */
        .tabs { display: flex; margin-bottom: 1rem; gap: 10px; }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #222;
            color: var(--text-muted);
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background: #444;
            color: white;
            border-color: #666;
        }

        /* MODE SELECTION */
        .mode-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        .mode-option {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: 0.2s;
        }
        .mode-option.selected {
            background: #333;
            border-color: #666;
            color: white;
            font-weight: bold;
        }

        .hidden { display: none !important; }

        .start-btn {
            background: white;
            color: black;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        /* --- READER SCREEN CSS --- */
        #reader-screen {
            width: 100%;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .info-bar {
            width: 90%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #ffffff;
            font-family: sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* --- THE OPTICAL ALIGNMENT ENGINE --- */
        .word-container {
            position: relative;
            padding: 40px 0;
            margin-bottom: 20px;
            width: 90%;
            max-width: 600px;
        }
        
        .word-container::before, .word-container::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: #555;
        }
        .word-container::before { top: 0; }
        .word-container::after { bottom: 0; }
        
        .center-marker-top, .center-marker-bottom {
            position: absolute;
            left: 50%;
            width: 2px;
            height: 12px;
            background: #555;
            transform: translateX(-50%);
            z-index: 10;
        }
        .center-marker-top { top: 0; }
        .center-marker-bottom { bottom: 0; }

        /* Grid System for Perfect Center Alignment */
        #word-stage {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: baseline;
            width: 100%;
            height: 5rem;
        }

        .segment {
            font-size: 4rem;
            white-space: pre;
            line-height: 1;
        }

        .segment.left {
            text-align: right;
            justify-self: end;
        }
        
        .segment.focus {
            color: var(--accent-red);
            /* Removed font-weight: bold; to match other letters */
            font-weight: normal; 
            text-align: center;
            justify-self: center;
        }
        
        .segment.right {
            text-align: left;
            justify-self: start;
        }

        .wpm-tag {
            width: 90%;
            max-width: 600px;
            text-align: right;
            color: #ffffff;
            font-family: sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
        }

        /* --- CONTROLS --- */
        .controls-area {
            position: absolute;
            bottom: 100px;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .btn-pause {
            background: var(--accent-red);
            border: none;
            color: #ffffff;
            padding: 20px 70px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .btn-pause:hover {
            background: #c0392b;
        }

        .paused-actions {
            display: flex;
            gap: 20px;
        }

        .btn-action {
            padding: 15px 30px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            min-width: 120px;
        }

        .btn-resume { background: white; color: black; }
        .btn-restart { background: #333; color: white; border: 1px solid #444; }
        .btn-exit { 
            margin-top: 20px; 
            background: transparent; 
            color: #444; 
            border: none; 
            font-size: 0.9rem; 
            cursor: pointer;
            text-decoration: underline;
        }

    </style>
</head>
<body onload="loadSettings()">

<div id="setup-screen" class="container">
    <h2>Speed Reader</h2>

    <div class="tabs">
        <button id="tab-paste" class="tab-btn active" onclick="switchTab('paste')">Paste</button>
        <button id="tab-generate" class="tab-btn" onclick="switchTab('generate')">Generate</button>
    </div>

    <div id="paste-section" class="input-group">
        <textarea id="user-text" placeholder="Paste text here..." oninput="saveSettings()"></textarea>
    </div>

    <div id="generate-section" class="input-group hidden">
        <label>Word Count</label>
        <input type="number" id="word-count" value="200" onchange="saveSettings()">
    </div>

    <div class="input-group">
        <label>Speed Mode</label>
        <div class="mode-selection">
            <div id="mode-fixed" class="mode-option selected" onclick="setSpeedMode('fixed')">Fixed Rate</div>
            <div id="mode-accel" class="mode-option" onclick="setSpeedMode('accel')">Acceleration</div>
        </div>
    </div>

    <div id="fixed-input-group" class="input-group">
        <label>Constant Speed (WPM)</label>
        <input type="number" id="wpm-fixed" value="300" step="10" onchange="saveSettings()">
    </div>

    <div id="accel-input-group" class="input-group hidden" style="display: flex; gap: 15px;">
        <div style="flex: 1;">
            <label>Start Speed</label>
            <input type="number" id="wpm-start" value="200" step="10" onchange="saveSettings()">
        </div>
        <div style="flex: 1;">
            <label>Target Speed</label>
            <input type="number" id="wpm-target" value="600" step="10" onchange="saveSettings()">
        </div>
    </div>

    <button class="start-btn" onclick="startReading()">START</button>
</div>

<div id="reader-screen" class="hidden">
    
    <div class="info-bar">
        <span><span id="word-counter">0</span> / <span id="total-words">0</span></span>
        <span id="time-counter">00:00</span>
    </div>

    <div class="word-container">
        <div class="center-marker-top"></div>
        <div id="word-stage">
            <div class="segment left" id="seg-left"></div>
            <div class="segment focus" id="seg-focus"></div>
            <div class="segment right" id="seg-right"></div>
        </div>
        <div class="center-marker-bottom"></div>
    </div>
    
    <div class="wpm-tag" id="display-wpm">300 wpm</div>

    <div class="controls-area">
        <button id="btn-pause" class="btn-pause" onclick="pauseReader()">PAUSE</button>

        <div id="paused-menu" class="hidden" style="display: flex; flex-direction: column; align-items: center;">
            <div class="paused-actions">
                <button class="btn-action btn-resume" onclick="resumeReader()">RESUME</button>
                <button class="btn-action btn-restart" onclick="restartReader()">RESTART</button>
            </div>
            <button class="btn-exit" onclick="goBack()">Exit</button>
        </div>
    </div>

</div>

<script>
    const stories = [
        "The night was pitch black, and the rain fell in sheets against the pavement. He walked quickly, collar turned up against the wind. Every shadow looked like a person, every sound like a footstep. He knew he shouldn't have taken the shortcut through the old park.",
        "To understand the universe, we must first understand the atom. These tiny building blocks make up everything we see, feel, and touch. Electrons orbit the nucleus in a dance of energy, creating the stability of matter. It is a world of probability and uncertainty.",
        "The chef chopped the onions with precision. Tears welled up in his eyes, but he didn't stop. The soup had to be perfect. Tonight was the night the critic was coming. He added a pinch of thyme and a splash of white wine. The aroma filled the kitchen."
    ];

    let contentWords = [];
    let currentIndex = 0;
    
    // Variables
    let isAccelerationMode = false;
    let currentSpeed = 300;
    let startSpeed = 200;
    let targetSpeed = 600;

    let timeoutId = null;
    let timerId = null;
    let secondsElapsed = 0;
    
    // --- MEMORY & SETTINGS ---

    function saveSettings() {
        localStorage.setItem('sr_mode', isAccelerationMode ? 'accel' : 'fixed');
        localStorage.setItem('sr_text', document.getElementById('user-text').value);
        localStorage.setItem('sr_count', document.getElementById('word-count').value);
        localStorage.setItem('sr_wpm_fixed', document.getElementById('wpm-fixed').value);
        localStorage.setItem('sr_wpm_start', document.getElementById('wpm-start').value);
        localStorage.setItem('sr_wpm_target', document.getElementById('wpm-target').value);
        
        const activeTab = document.getElementById('tab-paste').classList.contains('active') ? 'paste' : 'generate';
        localStorage.setItem('sr_active_tab', activeTab);
    }

    function loadSettings() {
        if(localStorage.getItem('sr_wpm_fixed')) {
            document.getElementById('wpm-fixed').value = localStorage.getItem('sr_wpm_fixed');
        }
        if(localStorage.getItem('sr_wpm_start')) {
            document.getElementById('wpm-start').value = localStorage.getItem('sr_wpm_start');
        }
        if(localStorage.getItem('sr_wpm_target')) {
            document.getElementById('wpm-target').value = localStorage.getItem('sr_wpm_target');
        }
        if(localStorage.getItem('sr_text')) {
            document.getElementById('user-text').value = localStorage.getItem('sr_text');
        }
        if(localStorage.getItem('sr_count')) {
            document.getElementById('word-count').value = localStorage.getItem('sr_count');
        }

        const tab = localStorage.getItem('sr_active_tab');
        if (tab) switchTab(tab);

        const mode = localStorage.getItem('sr_mode');
        if (mode) setSpeedMode(mode);
    }

    // --- SETUP LOGIC ---

    function switchTab(mode) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (mode === 'paste') {
            document.getElementById('tab-paste').classList.add('active');
            document.getElementById('paste-section').classList.remove('hidden');
            document.getElementById('generate-section').classList.add('hidden');
        } else {
            document.getElementById('tab-generate').classList.add('active');
            document.getElementById('paste-section').classList.add('hidden');
            document.getElementById('generate-section').classList.remove('hidden');
        }
        saveSettings();
    }

    function setSpeedMode(mode) {
        if (mode === 'fixed') {
            isAccelerationMode = false;
            document.getElementById('mode-fixed').classList.add('selected');
            document.getElementById('mode-accel').classList.remove('selected');
            document.getElementById('fixed-input-group').classList.remove('hidden');
            document.getElementById('accel-input-group').classList.add('hidden');
        } else {
            isAccelerationMode = true;
            document.getElementById('mode-fixed').classList.remove('selected');
            document.getElementById('mode-accel').classList.add('selected');
            document.getElementById('fixed-input-group').classList.add('hidden');
            document.getElementById('accel-input-group').classList.remove('hidden');
        }
        saveSettings();
    }

    function generateStory(count) {
        let fullText = stories.join(" ");
        let allWords = fullText.split(/\s+/);
        while (allWords.length < count) { allWords = allWords.concat(allWords); }
        return allWords.slice(0, count);
    }

    // --- MAIN EXECUTION ---

    function startReading() {
        saveSettings(); 

        const mode = document.getElementById('paste-section').classList.contains('hidden') ? 'generate' : 'paste';
        if (mode === 'paste') {
            const raw = document.getElementById('user-text').value.trim();
            if(!raw) return alert("Paste text first");
            contentWords = raw.split(/\s+/);
        } else {
            const count = parseInt(document.getElementById('word-count').value);
            contentWords = generateStory(count);
        }

        if (isAccelerationMode) {
            startSpeed = parseInt(document.getElementById('wpm-start').value);
            targetSpeed = parseInt(document.getElementById('wpm-target').value);
            currentSpeed = startSpeed;
        } else {
            currentSpeed = parseInt(document.getElementById('wpm-fixed').value);
        }

        currentIndex = 0;
        secondsElapsed = 0;
        
        document.getElementById('setup-screen').style.display = 'none';
        
        const readerScreen = document.getElementById('reader-screen');
        readerScreen.classList.remove('hidden');
        readerScreen.style.display = 'flex';
        
        document.getElementById('total-words').innerText = contentWords.length;
        document.getElementById('display-wpm').innerText = currentSpeed + " wpm";

        document.getElementById('btn-pause').classList.remove('hidden');
        document.getElementById('paused-menu').classList.add('hidden');
        document.querySelector('.btn-resume').style.display = 'block';

        processNextWord(); 
        startTimer();
    }

    // --- WORD RENDERING (Center Focus) ---
    function renderWord(word) {
        if(!word) return;

        let focusIndex = 0;
        const len = word.length;

        // Optimal Recognition Point Logic
        if (len === 1) focusIndex = 0;
        else if (len >= 2 && len <= 5) focusIndex = 1;
        else if (len >= 6 && len <= 9) focusIndex = 2;
        else if (len >= 10 && len <= 13) focusIndex = 3;
        else focusIndex = 4;
        
        if (focusIndex >= len) focusIndex = Math.floor(len / 2);

        const leftPart = word.substring(0, focusIndex);
        const focusChar = word.substring(focusIndex, focusIndex + 1);
        const rightPart = word.substring(focusIndex + 1);

        document.getElementById('seg-left').innerText = leftPart;
        document.getElementById('seg-focus').innerText = focusChar;
        document.getElementById('seg-right').innerText = rightPart;
    }

    function calculateCurrentWPM() {
        if (!isAccelerationMode) return currentSpeed;
        const progress = currentIndex / contentWords.length;
        const speedDiff = targetSpeed - startSpeed;
        const calculated = startSpeed + (speedDiff * progress);
        return Math.floor(calculated);
    }

    function processNextWord() {
        if (currentIndex >= contentWords.length) {
            finishReading();
            return;
        }

        renderWord(contentWords[currentIndex]);
        
        document.getElementById('word-counter').innerText = currentIndex + 1;

        let instantWPM = isAccelerationMode ? calculateCurrentWPM() : currentSpeed;
        document.getElementById('display-wpm').innerText = instantWPM + " wpm";

        const delay = 60000 / instantWPM;

        currentIndex++;
        timeoutId = setTimeout(processNextWord, delay);
    }

    function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
            secondsElapsed++;
            const m = Math.floor(secondsElapsed / 60).toString().padStart(2,'0');
            const s = (secondsElapsed % 60).toString().padStart(2,'0');
            document.getElementById('time-counter').innerText = `${m}:${s}`;
        }, 1000);
    }

    // --- CONTROLS ---

    function pauseReader() {
        clearTimeout(timeoutId);
        clearInterval(timerId);
        
        document.getElementById('btn-pause').classList.add('hidden');
        document.getElementById('paused-menu').classList.remove('hidden');
        
        document.getElementById('word-stage').style.opacity = "0.5";
    }

    function resumeReader() {
        document.getElementById('paused-menu').classList.add('hidden');
        document.getElementById('btn-pause').classList.remove('hidden');
        
        document.getElementById('word-stage').style.opacity = "1";
        
        processNextWord();
        startTimer();
    }

    function restartReader() {
        clearTimeout(timeoutId);
        clearInterval(timerId);
        
        currentIndex = 0;
        secondsElapsed = 0;
        
        if(isAccelerationMode) currentSpeed = startSpeed; 

        document.getElementById('time-counter').innerText = "00:00";
        document.getElementById('word-stage').style.opacity = "1";
        document.getElementById('display-wpm').innerText = isAccelerationMode ? startSpeed + " wpm" : currentSpeed + " wpm";
        
        document.getElementById('paused-menu').classList.add('hidden');
        document.getElementById('btn-pause').classList.remove('hidden');
        
        processNextWord();
        startTimer();
    }

    function finishReading() {
        clearTimeout(timeoutId);
        clearInterval(timerId);
        
        document.getElementById('seg-left').innerText = "";
        document.getElementById('seg-focus').innerText = "Done";
        document.getElementById('seg-right').innerText = "";
        
        document.getElementById('btn-pause').classList.add('hidden');
        document.getElementById('paused-menu').classList.remove('hidden');
        document.querySelector('.btn-resume').style.display = 'none'; 
    }

    function goBack() {
        clearTimeout(timeoutId);
        clearInterval(timerId);
        
        const readerScreen = document.getElementById('reader-screen');
        readerScreen.classList.add('hidden');
        readerScreen.style.display = 'none';
        
        document.getElementById('setup-screen').style.display = 'block';
    }

</script>
</body>
</html>
