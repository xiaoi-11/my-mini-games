<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Preparation Simulator</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }

        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }

        /* Forms and Inputs */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Screens */
        #exam-screen, #result-screen {
            display: none;
        }

        /* Exam specific */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .question-card {
            background: #f9f9f9;
            border-left: 5px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .options {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .options label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .clear-btn {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            margin-top: 10px;
        }

        /* Results specific */
        #result-text {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: monospace;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }

        .success-msg {
            color: var(--primary-color);
            text-align: center;
            font-weight: bold;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <h1>Exam Setup</h1>
        <div class="form-group">
            <label for="num-questions">Total Number of Questions:</label>
            <input type="number" id="num-questions" min="1" value="10" placeholder="e.g. 50">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="is-timed" onchange="toggleTimeInput()">
            <label for="is-timed" style="margin:0;">Time Bound Examination?</label>
        </div>

        <div class="form-group" id="time-input-group" style="display: none;">
            <label for="time-limit">Time Limit (in minutes):</label>
            <input type="number" id="time-limit" min="1" value="30">
        </div>

        <button onclick="startExam()">Start Exam</button>
    </div>


    <!-- EXAM SCREEN -->
    <div id="exam-screen">
        <div class="header-bar">
            <div id="question-tracker">Questions: 0 / 0</div>
            <div id="timer-display" style="display: none; font-size: 1.2em; font-weight: bold;">Time: --:--</div>
        </div>

        <div id="questions-container">
            <!-- Questions will be generated here by JS -->
        </div>

        <button onclick="submitExam()" style="background-color: #e67e22; margin-top: 30px; font-size: 18px;">Submit Exam</button>
    </div>


    <!-- RESULT SCREEN -->
    <div id="result-screen">
        <h1>Exam Results</h1>
        <p>Review your answers below. You can copy the exact format to your clipboard.</p>
        
        <textarea id="result-text" readonly></textarea>
        
        <button onclick="copyToClipboard()">Copy All Responses</button>
        <div id="copy-msg" class="success-msg">Copied to clipboard!</div>
        
        <button onclick="location.reload()" style="background-color: #7f8c8d; margin-top: 20px;">Setup New Exam</button>
    </div>

</div>

<script>
    let totalQuestions = 0;
    let timerInterval = null;
    let timeLeft = 0;
    const optionsArray = ['A', 'B', 'C', 'D'];

    // Show/Hide time limit input based on checkbox
    function toggleTimeInput() {
        const isTimed = document.getElementById('is-timed').checked;
        document.getElementById('time-input-group').style.display = isTimed ? 'block' : 'none';
    }

    // Start the exam
    function startExam() {
        totalQuestions = parseInt(document.getElementById('num-questions').value);
        const isTimed = document.getElementById('is-timed').checked;
        const timeLimit = parseInt(document.getElementById('time-limit').value);

        if (isNaN(totalQuestions) || totalQuestions < 1) {
            alert("Please enter a valid number of questions.");
            return;
        }

        // Generate the question UI
        generateQuestionsUI();

        // Handle Timer
        if (isTimed && !isNaN(timeLimit) && timeLimit > 0) {
            document.getElementById('timer-display').style.display = 'block';
            timeLeft = timeLimit * 60; // convert to seconds
            updateTimerDisplay();
            timerInterval = setInterval(countdownTimer, 1000);
        }

        document.getElementById('question-tracker').innerText = `Total Questions: ${totalQuestions}`;

        // Switch screens
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('exam-screen').style.display = 'block';
    }

    // Dynamically generate the HTML for questions
    function generateQuestionsUI() {
        const container = document.getElementById('questions-container');
        container.innerHTML = ''; // Clear just in case

        for (let i = 1; i <= totalQuestions; i++) {
            let optionsHTML = '';
            // Generate A, B, C, D radio buttons
            optionsArray.forEach(opt => {
                optionsHTML += `
                    <label>
                        <input type="radio" name="q${i}" value="${opt}"> ${opt}
                    </label>
                `;
            });

            const questionHTML = `
                <div class="question-card" id="card-${i}">
                    <label>Question ${i}</label>
                    <div class="options">
                        ${optionsHTML}
                    </div>
                    <button class="clear-btn" onclick="clearSelection(${i})">Clear Selection</button>
                </div>
            `;
            container.innerHTML += questionHTML;
        }
    }

    // Function to allow skipping/clearing a radio button selection
    function clearSelection(questionNumber) {
        const radios = document.getElementsByName(`q${questionNumber}`);
        for (let i = 0; i < radios.length; i++) {
            radios[i].checked = false;
        }
    }

    // Timer logic
    function countdownTimer() {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("Time is up! Submitting exam automatically.");
            submitExam();
        }
    }

    function updateTimerDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        if (minutes < 10) minutes = "0" + minutes;
        if (seconds < 10) seconds = "0" + seconds;
        document.getElementById('timer-display').innerText = `Time Left: ${minutes}:${seconds}`;
        
        // Turn red if less than 1 minute
        if (timeLeft <= 60) {
            document.getElementById('timer-display').style.color = '#ff6b6b';
        }
    }

    // Submit exam logic
    function submitExam() {
        // Stop the timer if it's running
        if (timerInterval) clearInterval(timerInterval);

        let resultString = "--- EXAM RESPONSES ---\n\n";

        // Read all responses
        for (let i = 1; i <= totalQuestions; i++) {
            const radios = document.getElementsByName(`q${i}`);
            let selectedValue = "Skipped";

            for (let j = 0; j < radios.length; j++) {
                if (radios[j].checked) {
                    selectedValue = radios[j].value;
                    break;
                }
            }

            resultString += `Number ${i}: ${selectedValue}\n`;
        }

        // Put result string into textarea
        document.getElementById('result-text').value = resultString;

        // Switch screens
        document.getElementById('exam-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
    }

    // Copy to clipboard logic
    function copyToClipboard() {
        const textArea = document.getElementById('result-text');
        textArea.select();
        textArea.setSelectionRange(0, 99999); // For mobile devices

        // Copy text
        navigator.clipboard.writeText(textArea.value).then(() => {
            const msg = document.getElementById('copy-msg');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }).catch(err => {
            alert('Failed to copy text. You can manually copy it from the text box.');
        });
    }
</script>
</body>
</html>
