<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Missile Dodge Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #72B8C9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevents zooming and scrolling on mobile */
        }

        canvas {
            display: block;
        }

        /* Top UI Bar */
        #ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: none;
        }

        .ui-box {
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        #pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.4);
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 10px;
            pointer-events: auto;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            pointer-events: auto;
            width: 80%;
            max-width: 300px;
        }

        #game-over h2 { margin-top: 0; }

        #game-over button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #E74C3C;
            color: white;
            font-weight: bold;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="ui-box">⭐ <span id="score">000</span></div>
        <div class="ui-box">⏱️ <span id="timer">00:00</span></div>
        <div class="ui-box">🚀 <span id="missiles-count">000</span></div>
    </div>
    <button id="pause-btn">||</button>

    <div id="game-over">
        <h2>GAME OVER</h2>
        <p>Survived: <span id="final-time"></span></p>
        <p>Score: <span id="final-score"></span></p>
        <button onclick="resetGame()">PLAY AGAIN</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const missilesEl = document.getElementById('missiles-count');
        const gameOverScreen = document.getElementById('game-over');
        const finalTimeEl = document.getElementById('final-time');
        const finalScoreEl = document.getElementById('final-score');
        const pauseBtn = document.getElementById('pause-btn');

        let width, height;
        let animationId;
        let isGameOver = false;
        let isPaused = false;

        // Game state
        let startTime;
        let score = 0;
        let frames = 0;
        
        // Input state (-1 = left, 1 = right, 0 = straight)
        let turnDirection = 0;

        // Entities
        let plane;
        let missiles = [];
        let clouds = [];

        // Resize Canvas
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling (Mouse and Touch)
        function handleInputStart(clientX) {
            if (isGameOver || isPaused) return;
            if (clientX < width / 2) {
                turnDirection = -1; // Turn left
            } else {
                turnDirection = 1;  // Turn right
            }
        }

        function handleInputEnd() {
            turnDirection = 0; // Stop turning
        }

        // Mouse events
        window.addEventListener('mousedown', (e) => {
            if (e.target !== pauseBtn && e.target.tagName !== 'BUTTON') {
                handleInputStart(e.clientX);
            }
        });
        window.addEventListener('mouseup', handleInputEnd);

        // Touch events for mobile
        window.addEventListener('touchstart', (e) => {
            if (e.target !== pauseBtn && e.target.tagName !== 'BUTTON') {
                e.preventDefault(); // Prevent accidental scrolling
                handleInputStart(e.touches[0].clientX);
            }
        }, { passive: false });
        window.addEventListener('touchend', handleInputEnd);


        // --- CLASSES ---

        class Plane {
            constructor() {
                this.x = width / 2;
                this.y = height / 2;
                this.angle = -Math.PI / 2; // Pointing up initially
                this.speed = 4.5; // Auto-forward speed
                this.turnSpeed = 0.08; // How fast it turns
                this.radius = 15; // Hitbox radius
            }

            update() {
                // Apply turning based on input
                if (turnDirection === -1) {
                    this.angle -= this.turnSpeed;
                } else if (turnDirection === 1) {
                    this.angle += this.turnSpeed;
                }

                // Move forward automatically
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Screen wrapping (go out one side, come in the other)
                if (this.x < -20) this.x = width + 20;
                if (this.x > width + 20) this.x = -20;
                if (this.y < -20) this.y = height + 20;
                if (this.y > height + 20) this.y = -20;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Detailed Jet Plane Design
                ctx.fillStyle = '#ECF0F1'; // Light grey/white body
                ctx.strokeStyle = '#BDC3C7'; // Darker grey outline
                ctx.lineWidth = 1;

                ctx.beginPath();
                ctx.moveTo(22, 0);         // Nose tip
                ctx.lineTo(12, 4);         // Right nose base
                ctx.lineTo(4, 4);          // Right wing front root
                ctx.lineTo(-6, 18);        // Right wing tip front
                ctx.lineTo(-12, 18);       // Right wing tip back
                ctx.lineTo(-6, 4);         // Right wing back root
                ctx.lineTo(-14, 3);        // Right tail front
                ctx.lineTo(-18, 10);       // Right tail tip
                ctx.lineTo(-22, 10);       // Right tail back
                ctx.lineTo(-20, 3);        // Right engine exhaust
                
                ctx.lineTo(-20, -3);       // Left engine exhaust
                ctx.lineTo(-22, -10);      // Left tail back
                ctx.lineTo(-18, -10);      // Left tail tip
                ctx.lineTo(-14, -3);       // Left tail front
                ctx.lineTo(-6, -4);        // Left wing back root
                ctx.lineTo(-12, -18);      // Left wing tip back
                ctx.lineTo(-6, -18);       // Left wing tip front
                ctx.lineTo(4, -4);         // Left wing front root
                ctx.lineTo(12, -4);        // Left nose base
                ctx.closePath();
                
                ctx.fill();
                ctx.stroke();

                // Cockpit window
                ctx.fillStyle = '#3498DB'; // Sky blue glass
                ctx.beginPath();
                ctx.ellipse(5, 0, 6, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Red nose tip accent
                ctx.fillStyle = '#E74C3C';
                ctx.beginPath();
                ctx.moveTo(22, 0);
                ctx.lineTo(17, 2);
                ctx.lineTo(17, -2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Missile {
            constructor() {
                // Spawn randomly off-screen
                if (Math.random() > 0.5) {
                    this.x = Math.random() > 0.5 ? -50 : width + 50;
                    this.y = Math.random() * height;
                } else {
                    this.x = Math.random() * width;
                    this.y = Math.random() > 0.5 ? -50 : height + 50;
                }
                
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 3.8 + (Math.random() * 0.5); // Slightly slower than plane
                this.turnSpeed = 0.025; // Homing turn rate
                this.radius = 8;
                this.trail = [];
            }

            update() {
                // Homing Logic: Steer towards plane
                let dx = plane.x - this.x;
                let dy = plane.y - this.y;
                let targetAngle = Math.atan2(dy, dx);

                // Smoothly rotate towards target
                let desiredX = Math.cos(targetAngle);
                let desiredY = Math.sin(targetAngle);
                let currentX = Math.cos(this.angle);
                let currentY = Math.sin(this.angle);
                
                let newX = currentX + (desiredX - currentX) * this.turnSpeed;
                let newY = currentY + (desiredY - currentY) * this.turnSpeed;
                this.angle = Math.atan2(newY, newX);

                // Move forward
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Add to trail
                if (frames % 3 === 0) {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 30) this.trail.shift(); // Max trail length
                }
            }

            draw() {
                // Draw Trail
                if (this.trail.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }

                // Draw Missile
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.fillStyle = '#E67E22'; // Orange body
                ctx.fillRect(-10, -3, 14, 6);
                
                ctx.fillStyle = '#C0392B'; // Red tip
                ctx.beginPath();
                ctx.moveTo(4, -3);
                ctx.lineTo(12, 0);
                ctx.lineTo(4, 3);
                ctx.fill();
                
                // Missile fins
                ctx.fillStyle = '#7F8C8D';
                ctx.fillRect(-10, -5, 4, 10);

                ctx.restore();
            }
        }

        class Cloud {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 30 + 40;
                this.speed = Math.random() * 0.3 + 0.1;
            }
            update() {
                this.y += this.speed; // Clouds drift downwards slightly
                if (this.y - this.size * 2 > height) {
                    this.y = -this.size * 2;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 0.8, this.y - this.size * 0.2, this.size * 0.8, 0, Math.PI * 2);
                ctx.arc(this.x - this.size * 0.8, this.y - this.size * 0.1, this.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- GAME LOGIC ---

        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            let seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function checkCollisions() {
            for (let m of missiles) {
                let dx = plane.x - m.x;
                let dy = plane.y - m.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < plane.radius + m.radius) {
                    gameOver();
                }
            }
        }

        function gameOver() {
            isGameOver = true;
            turnDirection = 0; // Reset input
            let timeSurvived = formatTime(Date.now() - startTime);
            finalTimeEl.innerText = timeSurvived;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'block';
        }

        function resetGame() {
            plane = new Plane();
            missiles = [];
            clouds = [];
            for (let i = 0; i < 7; i++) clouds.push(new Cloud());
            
            score = 0;
            frames = 0;
            turnDirection = 0;
            startTime = Date.now();
            isGameOver = false;
            gameOverScreen.style.display = 'none';
            missilesEl.innerText = "000";
            scoreEl.innerText = "000";
            
            animate();
        }

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            if (!isPaused && !isGameOver) {
                // Simple pause resume
                animate();
            }
        });

        // --- MAIN LOOP ---

        function animate() {
            if (isGameOver || isPaused) return;

            ctx.clearRect(0, 0, width, height);
            frames++;

            // Spawning Missiles based on time
            if (frames % 240 === 0 || frames === 10) { // Slightly faster spawn rate
                missiles.push(new Missile());
                missilesEl.innerText = String(missiles.length).padStart(3, '0');
            }

            // Update & Draw Clouds
            clouds.forEach(cloud => {
                cloud.update();
                cloud.draw();
            });

            // Update & Draw Missiles
            missiles.forEach(missile => {
                missile.update();
                missile.draw();
            });

            // Update & Draw Plane
            plane.update();
            plane.draw();

            // Collision & UI
            checkCollisions();
            
            if (frames % 60 === 0) { // Every ~1 second
                score += 10;
                scoreEl.innerText = String(score).padStart(3, '0');
            }
            
            let elapsedTime = Date.now() - startTime;
            timerEl.innerText = formatTime(elapsedTime);

            animationId = requestAnimationFrame(animate);
        }

        // Start Game
        resetGame();

    </script>
</body>
</html>
